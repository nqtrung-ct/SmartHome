# SmartHome server configuration.
# Copy to config.yaml and edit. Values can also be overridden with environment
# variables: SMARTHOME_<SECTION>__<KEY> (double underscore separates section
# from key), e.g. SMARTHOME_SERVER__ADMIN_TOKEN, SMARTHOME_DISCOVERY__NETWORK_SCAN.

server:
  host: 0.0.0.0          # LAN only - do not port-forward this on the router
  port: 8124
  admin_token: "changeme"   # token for the admin web UI - CHANGE THIS
  data_dir: data            # everything the server creates lives here
  advertise_mdns: true      # announce _smarthome._tcp so the Android app can auto-find the server

mqtt:                       # Mosquitto + Zigbee2MQTT (see instructions/phase-1-refer.md)
  enabled: false            # bật = true sau khi đã cài Mosquitto/Zigbee2MQTT
  host: 127.0.0.1
  port: 1883
  base_topic: zigbee2mqtt

stt:                        # speech-to-text
  engine: none              # "none" until models are installed; then "sherpa"
  model_dir: data/models/stt   # put the Zipformer-vi model files here (tokens.txt, *.onnx)
  num_threads: 2

tts:                        # text-to-speech
  engine: none              # "none" | "http"
  http_url: ""              # engine "http": POST {"text": "..."} -> audio/wav bytes

llm:                        # command understanding (tool calls)
  engine: ollama            # "ollama" (local, miễn phí) | "openai" (dịch vụ đám mây)
  base_url: http://127.0.0.1:11434
  model: qwen3:8b           # qwen3:4b hỏng trên Ollama (rò reasoning tiếng Anh); GPU 6GB dùng bản IQ4_XS
  timeout: 30
  # ---- engine "openai": mọi dịch vụ tương thích OpenAI ----
  # base_url: https://api.openai.com/v1     (hoặc https://openrouter.ai/api/v1,
  #   https://api.deepseek.com/v1, https://api.groq.com/openai/v1 ...)
  # model: gpt-4o-mini       # tên model của dịch vụ
  api_key: ""               # key của dịch vụ — config.yaml đã git-ignore
  local_model: ""           # model Ollama chạy khi fallback (rỗng = dùng llm.model)
  ollama_url: ""            # URL Ollama khi fallback (rỗng = http://127.0.0.1:11434)
  fallback: true            # cloud lỗi/mất mạng -> tự chuyển Ollama local

weather:                    # open-meteo, free, no API key
  latitude: 21.0285
  longitude: 105.8542

discovery:
  network_scan: true
  subnet: auto              # "auto" or e.g. 192.168.1.0/24
  mdns_seconds: 3
  ssdp_seconds: 3
  wsdiscovery: true         # ONVIF cameras (Imou)

broadlink:
  timeout: 5
  # local_ip: 192.168.1.10  # set only if discovery finds nothing (multi-NIC machines)

solar:
  poll_seconds: 300         # inverter: ít nhất 3 phút giữa các lần đọc, mặc định 5 phút

camera:
  poll_seconds: 60
  home_return_seconds: 60
  # PTZ native macOS qua proxy OrbStack (sửa IP cho đúng thiết bị):
  # ptz_proxy:
  #   "192.168.1.16": "127.0.0.1:13778"
  #   "192.168.1.15": "127.0.0.1:13779"

# TCP proxy khi server nền trên Mac không truy cập được LAN.
# Mẫu triển khai: deploy/macos/README.md. Chỉ mở các cổng này trên localhost.
# network:
#   tcp_proxies:
#     "192.168.1.5:6668": "127.0.0.1:16668"
#     "192.168.1.11:502": "127.0.0.1:15020"

# Frigate trên Mac: đổi API mặc định Windows :5000 sang :5001.
# frigate:
#   base_url: http://127.0.0.1:5001
