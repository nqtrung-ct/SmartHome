<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartHome</title>
<link rel="stylesheet" href="display.css">
</head>
<body>
<header>
  <div>
    <h1 id="greeting">Xin chào</h1>
    <p id="dateline">&nbsp;</p>
  </div>
  <div class="clock">
    <span id="lock-ind" class="lock-ind" title="Trạng thái (chỉ hiển thị) — bấm thiết bị để điều khiển">🔒</span>
    <div id="clock">--:--</div>
    <button id="fullscreen" title="Toàn màn hình">⛶</button>
  </div>
</header>

<main id="grid">
  <!-- cột trái: thời tiết + hẹn giờ -->
  <section class="col-left">
    <div class="card weather">
      <div class="weather-top">
        <span id="w-icon" class="w-icon">⛅</span>
        <div>
          <div id="w-temp" class="w-temp">--°</div>
          <div id="w-cond" class="muted">đang tải…</div>
        </div>
      </div>
      <div class="w-stats">
        <div><span class="w-num" id="w-wind">–</span><span class="w-lab">gió km/h</span></div>
        <div><span class="w-num" id="w-hum">–</span><span class="w-lab">độ ẩm %</span></div>
        <div><span class="w-num" id="w-rain">–</span><span class="w-lab">mưa %</span></div>
      </div>
      <div class="w-range muted" id="w-range">cao nhất --° · thấp nhất --°</div>
    </div>
    <div class="card">
      <h2>Hẹn giờ sắp tới</h2>
      <div id="timer-list"><p class="muted">Không có hẹn giờ.</p></div>
    </div>
  </section>

  <!-- phần còn lại (2 cột bên phải): card từng phòng (chỉ phòng có cảm biến nhiệt độ) -->
  <section class="col-rooms">
    <div id="room-grid" class="room-grid one"><p class="muted">Đang tải…</p></div>
  </section>
</main>

<!-- modal nhập mã PIN để điều khiển thiết bị -->
<div id="pin-overlay" class="overlay hidden">
  <div class="pin-box card">
    <button id="pin-close" class="icon-btn pin-close" title="Đóng">✕</button>
    <h2 id="pin-title">🔒 Xác nhận điều khiển</h2>
    <p id="pin-sub" class="muted small">Nhập mã PIN 4 số</p>
    <p class="muted small">Nhập đúng một lần: mọi thiết bị điều khiển được trong 5 phút.</p>
    <div class="pin-row">
      <input id="pin-input" class="pin-input" type="password" inputmode="numeric"
             maxlength="4" autocomplete="off" placeholder="••••">
      <button id="pin-clear" class="icon-btn" title="Xóa mã">⌫</button>
    </div>
    <div id="pin-error" class="pin-error"></div>
  </div>
</div>

<!-- bảng điều khiển thiết bị -->
<div id="ctrl-overlay" class="overlay hidden">
  <div class="ctrl-box card">
    <div class="ctrl-head">
      <span id="ctrl-icon" class="ctrl-icon">🔌</span>
      <div>
        <div id="ctrl-name" class="ctrl-name">Thiết bị</div>
        <div id="ctrl-room" class="muted small">Phòng</div>
      </div>
      <button id="ctrl-close" class="btn ghost">✕</button>
    </div>
    <div id="ctrl-body"></div>
  </div>
</div>

<script src="display.js"></script>
</body>
</html>
