<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhà Thông Minh</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="overlay hidden">
  <div class="card login-card">
    <h2>🔑 Đăng nhập</h2>
    <p>Nhập <code>admin_token</code> từ <code>config.yaml</code></p>
    <input id="login-token" type="password" placeholder="admin token" autocomplete="off">
    <button id="login-btn" class="primary">Vào</button>
    <div id="login-error" class="error"></div>
  </div>
</div>

<div id="device-modal" class="overlay hidden">
  <div class="card modal-card">
    <h2 id="m-title">➕ Thêm thiết bị thủ công</h2>
    <label>Tên thiết bị *
      <input id="m-name" placeholder="VD: Điều hòa phòng khách">
    </label>
    <label>Loại thiết bị
      <select id="m-driver">
        <option value="broadlink">Điều khiển (Broadlink hồng ngoại — thêm được thực thể, học mã IR)</option>
        <option value="tuya">Tuya WiFi</option>
        <option value="zigbee">Zigbee (đã pair trong Zigbee2MQTT)</option>
        <option value="onvif">Camera (ONVIF/RTSP)</option>
        <option value="generic">Khác (chỉ ghi nhận)</option>
        <option value="dummy">Ảo (test không cần phần cứng)</option>
      </select>
    </label>
    <label class="driver-field df-broadlink df-tuya df-onvif">Địa chỉ IP *
      <input id="m-host" placeholder="192.168.1.50">
    </label>
    <label class="driver-field df-broadlink">MAC (để trống = tự dò qua IP)
      <input id="m-mac" placeholder="e8:16:56:..">
    </label>
    <label class="driver-field df-tuya">Device ID (Tuya) *
      <input id="m-tuya-id" placeholder="xxxxxxxxxxxxxxxxxx">
    </label>
    <label class="driver-field df-tuya">Local key *
      <input id="m-tuya-key" type="password" placeholder="lấy qua tài khoản Tuya IoT / tinytuya">
    </label>
    <label class="driver-field df-onvif">Mật khẩu RTSP (lưu vào data/secrets.json)
      <input id="m-rtsp" type="password" placeholder="mã bảo mật in trên thân camera">
    </label>
    <label>Phòng
      <select id="m-room"></select>
    </label>
    <label class="small" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="m-newroom" style="width:auto"> Tạo phòng mới cho thiết bị này
    </label>
    <div id="m-newroom-wrap" class="hidden" style="padding-left:8px">
      <label>Tên phòng mới *
        <input id="m-newroom-name" placeholder="VD: Phòng ngủ">
      </label>
      <label>Tầng
        <select id="m-newroom-floor"></select>
      </label>
    </div>
    <div class="row" style="margin-top:14px">
      <button id="m-save" class="primary">💾 Lưu</button>
      <button id="m-cancel">Hủy</button>
      <span id="m-error" class="error"></span>
    </div>
  </div>
</div>

<div id="edit-modal" class="overlay hidden">
  <div class="card modal-card">
    <h2 id="e-title">✏️ Sửa thiết bị</h2>
    <label>Tên thiết bị
      <input id="e-name">
    </label>
    <label>Bí danh (nhiều cái cách nhau dấu phẩy)
      <input id="e-alias" placeholder="VD: điều hòa, máy lạnh">
    </label>
    <label>Phòng
      <select id="e-room"></select>
    </label>
    <div id="e-hw" class="small muted" style="margin:4px 0 10px"></div>
    <div id="e-children-wrap" class="hidden">
      <h3 style="margin:10px 0 6px">Thiết bị con (điều khiển qua hồng ngoại)</h3>
      <div id="e-children"></div>
      <div class="row" style="margin-top:6px">
        <button class="small-btn" id="e-add-child">＋ Thiết bị con</button>
      </div>
    </div>
    <div class="row" style="margin-top:16px;justify-content:space-between">
      <button class="small-btn danger" id="e-delete">🗑 Xóa</button>
      <div class="row">
        <button id="e-cancel">Hủy</button>
        <button class="primary" id="e-save">💾 Lưu</button>
      </div>
    </div>
  </div>
</div>

<header>
  <h1>🏠 Nhà Thông Minh</h1>
  <nav id="tabs">
    <button data-tab="dashboard" class="active">Tổng quan</button>
    <button data-tab="assistant">Trợ lý</button>
    <button data-tab="devices">Thiết bị</button>
    <button data-tab="discovery">Quét mạng</button>
    <button data-tab="voice">Máy thoại</button>
    <button data-tab="console">Lệnh</button>
    <button data-tab="events">Nhật ký</button>
    <button data-tab="settings">Thiết đặt</button>
  </nav>
</header>

<main>
  <section id="tab-dashboard" class="tab"></section>
  <section id="tab-assistant" class="tab hidden"></section>
  <section id="tab-devices" class="tab hidden"></section>
  <section id="tab-discovery" class="tab hidden"></section>
  <section id="tab-voice" class="tab hidden"></section>
  <section id="tab-console" class="tab hidden"></section>
  <section id="tab-events" class="tab hidden"></section>
  <section id="tab-settings" class="tab hidden"></section>
</main>

<script src="app.js"></script>
</body>
</html>
