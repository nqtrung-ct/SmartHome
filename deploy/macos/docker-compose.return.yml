services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smarthome-mosquitto
    restart: 'no'
    ports:
      - '127.0.0.1:1883:1883'
    volumes:
      - /Volumes/Data/frigate-return/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.2-standard-arm64
    container_name: smarthome-frigate
    restart: 'no'
    shm_size: 512mb
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - /Volumes/Data/frigate-return/config:/config
      - /Volumes/Data/frigate-return/db:/frigate-db
      - type: bind
        source: /Volumes/SHARE/Backup/Camera
        target: /media/frigate
        bind:
          create_host_path: false
    tmpfs:
      - /tmp/cache:size=512m
    ports:
      - '8971:8971'
      - '127.0.0.1:5001:5000'
      - '8555:8555/tcp'
      - '8555:8555/udp'
      - '1984:1984'
    depends_on:
      - mosquitto
